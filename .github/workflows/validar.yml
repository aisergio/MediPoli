name: Validar MediPoli
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aplicacion:
    name: Agenda
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Dependencias y pruebas
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit --prod --audit-level high
          pnpm run check:policy
          pnpm test
          pnpm run package:lambda
          pnpm run build
      - name: Registrar auditoría de las herramientas de compilación
        continue-on-error: true
        run: pnpm audit --audit-level high

  infraestructura:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false
      - name: Formato y esquema de cada configuración
        run: |
          terraform fmt -recursive -check infra
          for root in bootstrap ambiente laboratorio; do
            terraform -chdir="infra/$root" init -backend=false -input=false
            terraform -chdir="infra/$root" validate
          done
